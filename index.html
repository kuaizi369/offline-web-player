/** 清空全部扫描目录，回到「仅扫描播放器所在目录」 */
$('#rootReset').onclick = async () => {
  if (!confirm('清空全部扫描目录，恢复为「只扫描播放器所在目录及其子目录」？\n\n磁盘上的文件不会被动到。')) return;
  try {
    const r = await fetch('/api/roots/reset', { method: 'POST' });
    const j = await r.json();
    if (!j.ok) { toast(j.error || '操作失败', 'err'); return; }
    await waitScanDone();
    const lib = await reloadLibrary();
    if ($('#dirModal').classList.contains('open')) {
      renderDirCur();
      if (DIR.path) browse(DIR.path);
    }
    toast(`已恢复默认扫描范围 · ${lib.stats.total} 个文件`, 'ok');
  } catch (e) { toast('操作失败：' + e.message, 'err'); }
};

/* ── 目录选择器 ── */
const DIR = { path: '', parent: null, depth: 0, added: false };

function dirCrumbHtml(p, extra) {
  if (!p) return `磁盘列表${extra ? ` · ${esc(extra)}` : ''}`;
  const segs = p.replace(/\/$/, '').split('/');
  return segs.map((s, i) => `<b>${esc(s)}</b>`).join(' <span style="opacity:.4">›</span> ') +
         (extra ? ` <span style="opacity:.6">· ${esc(extra)}</span>` : '');
}

function renderDirList(j) {
  const box = $('#dirList');
  const rows = [];

  // 空路径 = 盘符视图
  if (!j.path) {
    if (!j.drives || !j.drives.length) {
      box.innerHTML = `<div class="dir-empty">没有发现可用磁盘</div>`;
      return;
    }
    rows.push(...j.drives.map((d) => `
      <button class="dir-row" data-go="${esc(d.path)}">
        <svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        <span class="dn">${esc(d.name)} 磁盘</span>
        ${d.freeText ? `<span class="dtag">可用 ${esc(d.freeText)} / ${esc(d.totalText)}</span>` : ''}
        <span class="dadd" data-add="${esc(d.path)}">＋ 添加</span>
      </button>`).join(''));
  } else {
    if (j.parent !== null) {
      rows.push(`
        <button class="dir-row" data-go="${esc(j.parent)}">
          <svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          <span class="dn">… 返回上级</span>
        </button>`);
    }
    if (!j.dirs.length) {
      rows.push(`<div class="dir-empty">这个文件夹里没有子文件夹</div>`);
    } else {
      rows.push(...j.dirs.map((d) => `
        <button class="dir-row ${d.isSystem ? 'warn' : ''}" data-go="${esc(d.path)}" title="${esc(d.path)}">
          <svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="dn">${esc(d.name)}</span>
          ${d.isSystem ? '<span class="dtag">系统目录</span>' : ''}
          ${d.added
            ? '<span class="dtag">已添加</span><span class="drm" data-del="' + esc(d.path) + '">－ 移除</span>'
            : '<span class="dadd" data-add="' + esc(d.path) + '">＋ 添加</span>'}
        </button>`).join(''));
    }
  }
  box.innerHTML = rows.join('');

  $$('#dirList .dir-row').forEach((r) => {
    r.onclick = (e) => {
      const ds = (e.target && e.target.dataset) || {};
      if (ds.add) { e.stopPropagation(); doAddRoot(ds.add); return; }
      if (ds.del) { e.stopPropagation(); askRemoveRoot(ds.del); return; }
      const go = r.dataset.go;
      if (go !== undefined) browse(go);
    };
  });
}

async function browse(p) {
  $('#dirList').innerHTML = `<div class="dir-empty">正在读取…</div>`;
  try {
    const j = await (await fetch('/api/browse?path=' + encodeURIComponent(p || ''), { cache: 'no-store' })).json();
    if (!j.ok) {
      // 关键：读不到就把内部路径清空，否则「添加当前目录」会加到一个
      // 跟输入框里显示的完全不同的目录（用户看到 A、实际加的是 B）
      DIR.path = '';
      DIR.parent = null;
      DIR.added = false;
      syncDirPick();
      toast(j.error || '无法打开该目录', 'err');
      $('#dirList').innerHTML = `<div class="dir-empty">${esc(j.error || '无法打开该目录')}<br>可以用「↑ 上级」回到可访问的位置。</div>`;
      $('#dirCrumb').innerHTML = dirCrumbHtml('', '路径无效');
      return;
    }
    DIR.path = j.path;
    DIR.parent = j.parent;
    DIR.added = !!j.added;
    $('#dirPath').value = j.path || '';
    syncDirPick();
    const sig = j.path ? (j.isDriveRoot ? '整个磁盘' : `可用 ${j.freeText || '—'}`) : '选择磁盘';
    $('#dirCrumb').innerHTML = dirCrumbHtml(j.path, sig);
    if (j.isSystem) toast('这是系统目录，扫描它会很慢，一般不需要', 'err');
    // 目录名默认填进「显示名称」，但用户自己改过就不再覆盖
    const base = j.path ? j.path.replace(/\/$/, '').split('/').pop() : '';
    if (base && (!$('#dirLabel').value || DIR.autoLabel)) {
      $('#dirLabel').value = base;
      DIR.autoLabel = true;
    }
    renderDirList(j);
  } catch (e) {
    DIR.path = '';
    DIR.parent = null;
    DIR.added = false;
    syncDirPick();
    $('#dirList').innerHTML = `<div class="dir-empty">读取失败：${esc(e.message)}</div>`;
  }
}

/** 底部主按钮：当前目录已添加 → 变成「移出扫描范围」，反之是「添加当前目录」 */
function syncDirPick() {
  const b = $('#dirPick');
  if (DIR.added) {
    b.textContent = '－ 移出扫描范围';
    b.classList.remove('primary');
    b.classList.add('danger');
  } else {
    b.textContent = '添加当前目录';
    b.classList.add('primary');
    b.classList.remove('danger');
  }
}

/** 添加一个目录；整盘需二次确认 */
async function doAddRoot(path, force) {
  const label = ($('#dirLabel').value || '').trim();
  const group = $('#dirGroup').value;
  const btn = $('#dirPick');
  btn.disabled = true;
  try {
    const r = await fetch('/api/roots/add', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, label, group, force: !!force })
    });
    const j = await r.json();

    if (!j.ok) {
      if (j.code === 'DRIVE_ROOT') {
        btn.disabled = false;
        if (confirm(`${j.error}\n\n确定仍要把整个磁盘加入扫描范围吗？`)) {
          await doAddRoot(path, true);
        }
        return;
      }
      toast(j.error || '添加失败', 'err');
      return;
    }

    if (!j.added) { toast(j.message || '该目录已在扫描范围内'); return; }

    $('#dirModal').classList.remove('open');
    toast(j.keptDefault
      ? `已添加「${j.label}」，并保留了播放器所在目录`
      : `已添加「${j.label}」 · 正在扫描…`, 'ok');

    await waitScanDone();
    const lib = await reloadLibrary();
    toast(`扫描完成 · ${lib.stats.total} 个文件 · ${lib.roots.length} 个目录`, 'ok');
  } catch (e) {
    toast('添加失败：' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

$('#rootAdd').onclick = () => {
  DIR.autoLabel = true;
  $('#dirLabel').value = '';
  $('#dirModal').classList.add('open');
  renderDirCur();
  browse('');
};
$('#dirClose').onclick = () => $('#dirModal').classList.remove('open');
$('#dirModal').addEventListener('click', (e) => {
  if (e.target.id === 'dirModal') $('#dirModal').classList.remove('open');
});
/** 用户输入的路径做规范化：统一斜杠，并保留盘符根目录末尾的斜杠
 *  （Windows 上 "C:" 是「C 盘的当前目录」这种相对路径，必须写成 "C:/"） */
function normInputPath(v) {
  let s = String(v || '').trim().replace(/\\/g, '/');
  if (/^[A-Za-z]:\/?$/.test(s)) return s[0].toUpperCase() + ':/';
  return s.replace(/\/+$/, '');
}

$('#dirGo').onclick = () => {
  const v = normInputPath($('#dirPath').value);
  if (!v) { browse(''); return; }
  DIR.autoLabel = true;
  browse(v);
};
$('#dirPath').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#dirGo').click(); });
// 用户手动改过名称之后，就不再被「自动填目录名」覆盖
$('#dirLabel').addEventListener('input', () => { DIR.autoLabel = false; });
$('#dirUp').onclick = () => browse(DIR.parent === null ? '' : DIR.parent);
$('#dirPick').onclick = () => {
  if (!DIR.path) { toast('先进入一个具体的文件夹，或用列表里的「＋ 添加」按钮', 'err'); return; }
  if (DIR.added) askRemoveRoot(DIR.path);
  else doAddRoot(DIR.path, false);
};

/* ══════════════════  联网补全曲风  ══════════════════ */
$('#genreSync').onclick = async () => {
  const btn = $('#genreSync');
  if (btn.disabled) return;
  btn.disabled = true;
  const orig = '☁ 联网补全';
  try {
    let initialTotal = 0;
    let guard = 0;
    while (guard++ < 300) {
      const r = await fetch('/api/genre-online', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ limit: 60 })
      });
      const j = await r.json();
      if (!j.ok) { toast(j.error || '补全中断', 'err'); break; }
      if (!j.online) { toast('当前无网络，无法联网补全（已保留本地分类结果）', 'err'); break; }
      if (!initialTotal) initialTotal = j.remaining + j.processed;
      const done = initialTotal ? Math.max(0, initialTotal - j.remaining) : 0;
      btn.textContent = `☁ ${initialTotal ? Math.round((done / initialTotal) * 100) : 100}%`;
      if (j.remaining === 0) break;
    }
    const un = (S.lib.genres || []).find((g) => g.id === '__unknown');
    toast(initialTotal ? `联网曲风补全完成${un ? ` · 剩余未识别 ${un.count} 首` : ''}` : '没有需要补全的歌曲', 'ok');
  } catch (e) { toast('补全失败：' + e.message, 'err'); }
  btn.disabled = false;
  btn.textContent = orig;
  try { await reloadLibrary(); } catch { /* 保持现状 */ }
};

/* ══════════════════  事件绑定  ══════════════════ */
$('#play').onclick = () => {
  if (!S.cur) {
    if (S.filtered.length) playTrack(S.filtered[0], S.filtered);
    return;
  }
  if (S.cur.kind === 'video') { openVideoTab(S.cur); return; }   // 视频：再开一个浏览器标签页
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
};
$('#next').onclick = () => nextTrack(false);
$('#prev').onclick = prevTrack;
$('#shuffle').onclick = () => {
  S.shuffle = !S.shuffle;
  $('#shuffle').classList.toggle('on', S.shuffle);
  const cur = S.cur ? S.queue.indexOf(S.cur.id) : -1;
  rebuildOrder();
  if (cur >= 0) S.pos = S.order.indexOf(cur);
  toast(S.shuffle ? '随机播放已开启' : '随机播放已关闭');
};
$('#repeat').onclick = () => {
  S.repeat = S.repeat === 'off' ? 'all' : S.repeat === 'all' ? 'one' : 'off';
  const el = $('#repeat');
  el.classList.toggle('on', S.repeat !== 'off');
  el.title = { off: '不循环 (R)', all: '列表循环 (R)', one: '单曲循环 (R)' }[S.repeat];
  el.querySelector('svg').innerHTML = S.repeat === 'one'
    ? '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="12" y="15" font-size="9" fill="currentColor" stroke="none" text-anchor="middle" font-weight="700">1</text>'
    : '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>';
  save();
};
$('#mute').onclick = () => {
  if (S.volume > 0) { S.lastVol = S.volume; S.volume = 0; }
  else { S.volume = S.lastVol || 1; }
  applyVolume();
};
$('#rate').onchange = (e) => {
  S.rate = Number(e.target.value);
  audio.playbackRate = S.rate;
  toast(`播放速度 ${S.rate}×`);
};
$('#sysOpen').onclick = () => openWithSystem();
$('#queueBtn').onclick = () => {
  const dr = $('#drawer');
  dr.classList.toggle('open');
  // 打开时定位到正在播放的那一条，避免队列很长时找不到当前文件
  if (dr.classList.contains('open') && S.cur) {
    const i = S.queue.indexOf(S.cur.id);
    const row = i >= 0 ? $(`.qrow[data-i="${i}"]`) : null;
    if (row) requestAnimationFrame(() => { if (row.scrollIntoView) row.scrollIntoView({ block: 'center', behavior: 'smooth' }); });
  }
};
$('#qClose').onclick = () => $('#drawer').classList.remove('open');
$('#qClear').onclick = () => {
  S.queue = []; S.order = []; S.pos = -1; S.cur = null;
  audio.pause(); audio.removeAttribute('src');
  save(); renderQueue(); updateBadge(); updatePlayerUI(); markCurrentRow();
  toast('队列已清空');
};
$('#qExport').onclick = async () => {
  if (!S.queue.length) return toast('队列为空', 'err');
  try {
    const r = await fetch('/api/export', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: S.queue, name: `播放列表_${new Date().toISOString().slice(0, 10)}` })
    });
    const j = await r.json();
    if (j.ok) toast(`已导出 ${j.count} 首 → 播放列表导出/${j.file.split(/[\\/]/).pop()}`, 'ok');
    else toast(j.error || '导出失败', 'err');
  } catch (e) { toast('导出失败：' + e.message, 'err'); }
};

$('#q').addEventListener('input', (e) => {
  S.q = e.target.value;
  $('#searchWrap').classList.toggle('has', !!S.q);
  render();
});
$('#qClear').onclick = () => {
  S.q = ''; $('#q').value = '';
  $('#searchWrap').classList.remove('has');
  render();
};
$('#sort').value = S.sort;
$('#sort').onchange = (e) => { S.sort = e.target.value; save(); render(); };

$$('#kindSeg button').forEach((b) => b.onclick = () => {
  S.kind = b.dataset.kind;
  $$('#kindSeg button').forEach((x) => x.classList.toggle('on', x === b));
  render();
});
$$('#viewSeg button').forEach((b) => b.onclick = () => {

  $$('#viewSeg button').forEach((x) => x.classList.toggle('on', x === b));
  render();

function syncSegs() {
  $$('#kindSeg button').forEach((x) => x.classList.toggle('on', x.dataset.kind === S.kind));
  $$('#viewSeg button').forEach((x) => x.classList.toggle('on', x.dataset.view === S.view));
}

/* ══════════════════  侧栏宽度拖拽  ══════════════════ */
const SIDE_MIN = 200, SIDE_MAX = 560, SIDE_DEF = 264;

function setSideW(px, persist) {
  const w = Math.min(SIDE_MAX, Math.max(SIDE_MIN, Math.round(px)));
  document.documentElement.style.setProperty('--side-w', w + 'px');
  if (persist) localStorage.setItem('pv.sideW', String(w));
}
// 恢复上次宽度（越界值直接夹到合法区间）
(function restoreSideW() {
  const saved = Number(localStorage.getItem('pv.sideW'));
  if (saved) setSideW(saved, false);
})();

(() => {
  const grip = $('#sideGrip');
  let dragging = false;

  grip.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    grip.classList.add('on');
    document.body.classList.add('resizing');
    if (grip.setPointerCapture && e.pointerId != null) grip.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  grip.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    setSideW(e.clientX, false);          // 拖动中只改样式，松手才落盘
  });
  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    grip.classList.remove('on');
    document.body.classList.remove('resizing');
    setSideW(e.clientX, true);
    if (grip.hasPointerCapture && e.pointerId != null && grip.hasPointerCapture(e.pointerId)) {
      grip.releasePointerCapture(e.pointerId);
    }
  };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  // 双击复位
  grip.addEventListener('dblclick', () => { setSideW(SIDE_DEF, true); toast('侧栏宽度已复位', 'ok'); });
})();

/* ══════════════════  侧栏内分区高度拖拽  ══════════════════
   侧栏纵向：扫描目录(root) / 曲风(genre) 两个定高分区，
   专辑·文件夹(album) 自动吃掉剩余高度。两条边界各自可拖：
   拖某条边界 = 调整它上方分区的高度，空间向下方分区依次借（压到下限为止）。 */
const PANE_ORDER = ['root', 'genre'];
const PANE_MIN  = { root: 56, genre: 56 };    // 各分区最小高度
const PANE_DEF  = { root: 164, genre: 150 };  // 双击复位值
const PANE_ALBUM_MIN = 92;                      // 末区最小高度，保证不会被压没
const PANE_EL    = { root: $('#rootNav'), genre: $('#genreNav') };
const PANE_ALBUM = $('#albumNav');
const PANE = { ...PANE_DEF };   // 当前高度（唯一数据源）

function setPaneH(key, px) {
  const v = Math.max(PANE_MIN[key], Math.round(px));
  PANE[key] = v;
  document.documentElement.style.setProperty('--pane-' + key, v + 'px');
}
/** 三区可用总高 = 侧栏高 - 品牌区/关于区/标题行/按钮等固定占用
    注意：必须跳过 position:absolute/fixed 的子元素 —— 宽度手柄 .side-grip 是
    top:0;bottom:0，offsetHeight 等于整个侧栏高，算进去会把可用高度压成 0。 */
function paneAvail() {
  const side = PANE_EL.root.closest('.side');
  if (!side) return 0;
  const sideH = side.clientHeight;
  if (!sideH) return 0;                                    // 侧栏尚未布局（隐藏/未渲染）
  let fixed = 0;
  Array.prototype.forEach.call(side.children, (c) => {
    if (c === PANE_EL.root || c === PANE_EL.genre || c === PANE_ALBUM) return;
    const cs = getComputedStyle(c);
    if (cs.position === 'absolute' || cs.position === 'fixed') return;   // 脱离文档流，不占高度
    // 连 margin 一起算：分隔条用了负 margin 收间距，漏算会让可用高度偏小
    fixed += c.offsetHeight
      + (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
  });
  return Math.max(0, sideH - Math.max(0, fixed));          // 负 margin 不得让可用值虚高
}

function savePanes() {
  const o = {};
  for (const k of PANE_ORDER) o[k] = PANE[k];
  localStorage.setItem('pv.paneH', JSON.stringify(o));   // 旧版本含 nav 字段，读时忽略即可
}
function restorePanes() {
  try {
    const s = JSON.parse(localStorage.getItem('pv.paneH') || 'null');
    if (s) for (const k of PANE_ORDER) if (Number(s[k]) > 0) setPaneH(k, s[k]);
  } catch (e) { /* 缓存坏了就用默认值 */ }
}
/** 窗口变矮时按比例收缩定高分区，保证末区不小于下限 */
function clampPanes() {
  const avail = paneAvail();
  if (avail <= 0) return;                        // 量不到（未布局/隐藏）就别乱改
  const limit = Math.max(0, avail - PANE_ALBUM_MIN);
  const sum = PANE_ORDER.reduce((s, k) => s + PANE[k], 0);
  if (sum <= limit) return;
  // 先按比例收缩；某区到下限后没缩够的，由余量大的区继续退
  const k = limit / sum;
  const hs = {};
  PANE_ORDER.forEach((p) => { hs[p] = Math.max(PANE_MIN[p], Math.round(PANE[p] * k)); });
  let over = PANE_ORDER.reduce((s, p) => s + hs[p], 0) - limit;
  for (let guard = 0; guard < 8 && over > 0; guard++) {
    const slack = PANE_ORDER
      .map((p) => ({ p, v: hs[p] - PANE_MIN[p] }))
      .filter((x) => x.v > 0)
      .sort((a, b) => b.v - a.v)[0];
    if (!slack) break;                           // 全部触底（窗口极矮），只能溢出
    const cut = Math.min(slack.v, over);
    hs[slack.p] -= cut;
    over -= cut;
  }
  PANE_ORDER.forEach((p) => setPaneH(p, hs[p]));
}

/** 拖动某条边界：调整它上方分区（key）的高度，dy>0 = 该分区变高。
    空间从下方分区依次借：先紧挨着的，压到下限后继续往后；专辑区隐式吸收剩余，
    始终保底 PANE_ALBUM_MIN。base/avail 为按下那一刻的快照，防连续拖动累积误差。 */
function dragPane(key, dy, base, avail) {
  const k = PANE_ORDER.indexOf(key);
  let aboveSum = 0, belowMin = 0;
  PANE_ORDER.forEach((p, i) => {
    if (i < k) aboveSum += base[p];
    else if (i > k) belowMin += PANE_MIN[p];
  });
  const cap = avail - PANE_ALBUM_MIN - aboveSum - belowMin;
  const h = Math.max(PANE_MIN[key], Math.min(base[key] + dy, cap));
  setPaneH(key, h);
  let need = h - base[key];                      // >0: 下方共需腾出；<0: 下方可分得
  for (let j = k + 1; j < PANE_ORDER.length && need !== 0; j++) {
    const p = PANE_ORDER[j];
    if (need > 0) {
      const take = Math.min(base[p] - PANE_MIN[p], need);
      if (take > 0) { setPaneH(p, base[p] - take); need -= take; }
    } else {
      setPaneH(p, base[p] - need);               // 释放的空间全给紧挨着的下一区
      need = 0;
    }
  }
}

(() => {
  $$('.vsplit').forEach((bar) => {
    const key = bar.dataset.vs;

    bar.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || bar.dataset.dragging) return;
      bar.dataset.dragging = '1';
      const y0 = e.clientY;
      const base = { ...PANE };                      // 只在按下时量一次
      const avail = paneAvail();
      bar.classList.add('on');
      document.body.classList.add('resizing-v');
      e.preventDefault();

      // 监听挂在 window 上：即使指针飞出分隔条甚至捕获失败，拖动也不会断
      const move = (ev) => dragPane(key, ev.clientY - y0, base, avail);
      const up = () => {
        delete bar.dataset.dragging;
        bar.classList.remove('on');
        document.body.classList.remove('resizing-v');
        savePanes();                                 // 松手才落盘
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    });

    // 双击复位全部分区
    bar.addEventListener('dblclick', () => {
      PANE_ORDER.forEach((p) => setPaneH(p, PANE_DEF[p]));
      clampPanes(); savePanes();
      toast('分区高度已复位', 'ok');
    });
  });
})();

restorePanes();
window.addEventListener('resize', clampPanes);
// 首次布局完成后再夹一次（恢复的高度可能超出当前窗口）
if (document.readyState === 'complete') clampPanes();
else window.addEventListener('load', clampPanes);

/* ── 键盘快捷键 ── */
document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if ($('#delModal').classList.contains('open')) $('#delModal').classList.remove('open');
    else if ($('#dirModal').classList.contains('open')) $('#dirModal').classList.remove('open');
    else if ($('#drawer').classList.contains('open')) $('#drawer').classList.remove('open');
    else if (typing) e.target.blur();
    return;
  }
  if (typing) return;
  switch (e.key) {
    case ' ':      e.preventDefault(); $('#play').click(); break;
    case 'ArrowRight': audio.currentTime = Math.min((audio.currentTime || 0) + 5, audio.duration || 1e9); break;
    case 'ArrowLeft':  audio.currentTime = Math.max((audio.currentTime || 0) - 5, 0); break;
    case 'ArrowUp':   e.preventDefault(); S.volume = Math.min(1, S.volume + .05); applyVolume(); break;
    case 'ArrowDown': e.preventDefault(); S.volume = Math.max(0, S.volume - .05); applyVolume(); break;
    case 'n': case 'N': nextTrack(false); break;
    case 'p': case 'P': prevTrack(); break;
    case 'm': case 'M': $('#mute').click(); break;
    case 's': case 'S': $('#shuffle').click(); break;
    case 'r': case 'R': $('#repeat').click(); break;
    case 'q': case 'Q': $('#queueBtn').click(); break;
    case '/': e.preventDefault(); $('#q').focus(); break;
  }
});

/* ── 启动 ── */
syncSegs();
applyVolume();
buildRoots();
bindInfiniteScroll();
$('#shuffle').classList.toggle('on', S.shuffle);
$('#repeat').classList.toggle('on', S.repeat !== 'off');
$('#repeat').title = { off: '不循环 (R)', all: '列表循环 (R)', one: '单曲循环 (R)' }[S.repeat];

// 支持 #add-dir 直达「添加扫描目录」（书签/排查时有用）
if (location.hash === '#add-dir') setTimeout(() => $('#rootAdd').click(), 400);

boot();
</script>
